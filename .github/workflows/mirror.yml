name: Mirror to technologyswamp/Zona_Fitri

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to technologyswamp/Zona_Fitri
        env:
          DEST_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git remote add target "https://x-access-token:${DEST_TOKEN}@github.com/technologyswamp/Zona_Fitri.git" || git remote set-url target "https://x-access-token:${DEST_TOKEN}@github.com/technologyswamp/Zona_Fitri.git"
          git push target master --force
