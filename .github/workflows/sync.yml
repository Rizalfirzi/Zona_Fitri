name: Sync Multi-Brand Coffee Snapshots

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: sync-multi-brand-coffee
  cancel-in-progress: true

jobs:
  sync-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo dnspython

      - name: Run Multi-Brand Sync to MongoDB Atlas
        env:
          PYTHONUNBUFFERED: "1"
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://technologyswamp_db_user:EmmGSARebSpWS0Sw@cluster-utama.eyzthyo.mongodb.net/zona_fitri?retryWrites=true&w=majority' }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE || 'zona_fitri' }}
        run: |
          python scripts/sync_mongodb.py



