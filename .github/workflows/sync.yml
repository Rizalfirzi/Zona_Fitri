name: Realtime Sync to MongoDB Atlas

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo dnspython

      - name: Run Multi-Brand MongoDB Sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://technologyswamp_db_user:EmmGSARebSpWS0Sw@cluster-utama.eyzthyo.mongodb.net/zona_fitri?retryWrites=true&w=majority' }}
        run: |
          python scripts/sync_mongodb.py

      - name: Commit updated snapshots (optional)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sync"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): update master database snapshots [skip ci] [skip vercel]" && git push)

